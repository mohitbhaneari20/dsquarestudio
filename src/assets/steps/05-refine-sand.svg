<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="1200" height="900" class="dsq play">
<title>Dsquare Studio, step 5: Refine</title>
<style>
.dsq .w,.dsq .ring{transform-box:fill-box;transform-origin:center}

.dsq .line{stroke-dasharray:1;stroke-dashoffset:1}
.dsq .scene{opacity:0}
.dsq.play .scene{animation:in .7s cubic-bezier(.22,1,.36,1) forwards}
.dsq.play .line{animation:draw 1.9s cubic-bezier(.65,0,.35,1) .35s forwards}
.dsq .ring{fill:none;stroke-width:3;opacity:0;transform-origin:center}
.dsq.play .ring{animation:ring .8s cubic-bezier(.22,1,.36,1) forwards}
.dsq.play .a-scan{animation:scan 5s ease-in-out 1s infinite}
.dsq.play .a-bob{animation:bob 4s ease-in-out 1s infinite}
.dsq.play .a-bob.d2{animation-delay:1.6s}
.dsq.play .a-bob.d3{animation-delay:2.2s}
.dsq.play .a-wobble{animation:wobble 3.2s ease-in-out 1.2s infinite}
.dsq.play .a-scribble{animation:scribble 1.6s ease-in-out 1s infinite}
.dsq.play .a-spin{animation:spin 9s linear infinite}
.dsq .a-drop{opacity:0}
.dsq.play .a-drop{animation:drop .9s cubic-bezier(.34,1.56,.64,1) 1.3s forwards}
.dsq .a-pop{transform:scale(0)}
.dsq.play .a-pop{animation:pop .7s cubic-bezier(.34,1.56,.64,1) 2s forwards}
.dsq.play .a-rub{animation:rub 1.2s ease-in-out 1s infinite}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(3.4)}}
@keyframes scan{0%,100%{transform:translate(0,0)}25%{transform:translate(-16px,-10px)}50%{transform:translate(10px,-16px)}75%{transform:translate(14px,6px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}65%{transform:rotate(4deg)}}
@keyframes scribble{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(6px,-4px) rotate(2deg)}50%{transform:translate(-3px,3px) rotate(-1deg)}75%{transform:translate(5px,2px) rotate(1.5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{0%{opacity:0;transform:translate(30px,-60px) rotate(10deg)}100%{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes rub{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
@media (prefers-reduced-motion:reduce){.dsq.play *{animation:none!important}.dsq .line{stroke-dashoffset:0}.dsq .scene,.dsq .a-drop{opacity:1}.dsq .a-pop{transform:none}}
