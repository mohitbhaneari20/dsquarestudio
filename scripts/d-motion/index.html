<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>D motion</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 720px; height: 540px; }
  #status { color: #ccc; font: 12px monospace; padding: 6px; }
</style>
</head>
<body>
<canvas id="c" width="1440" height="1080"></canvas>
<div id="status"></div>
<script>
const W = 1440, H = 1080, T = 8; // loop length (s)
const c = document.getElementById('c');
const g = c.getContext('2d');

const PAL = {
  design:  { bg: '#FA5C01', ink: '#000000', paper: '#FAFAFA', grid: 'rgba(0,0,0,0.10)', soft: 'rgba(0,0,0,0.35)' },
  develop: { bg: '#D5D1C8', ink: '#000000', paper: '#FAFAFA', grid: 'rgba(103,88,69,0.16)', soft: '#675845', accent: '#FA5C01' },
  deploy:  { bg: '#2F2F2F', ink: '#FAFAFA', paper: '#FAFAFA', grid: 'rgba(250,250,250,0.07)', soft: 'rgba(250,250,250,0.35)', accent: '#FA5C01' },
};

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));           // 0..1 progress inside [a,b]
const eo = (x) => 1 - Math.pow(1 - x, 3);                      // ease out
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const s = 1.6; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
/** in over [a,b], out over [c,d] → 0..1..0 */
const life = (t, a, b, c2, d) => Math.min(eio(seg(t, a, b)), 1 - eio(seg(t, c2, d)));

function grid(p) {
  g.fillStyle = p.bg; g.fillRect(0, 0, W, H);
  g.strokeStyle = p.grid; g.lineWidth = 1.5;
  const s = 80;
  g.beginPath();
  for (let x = s; x < W; x += s) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (let y = s; y < H; y += s) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();
}
function line(x1, y1, x2, y2, k = 1) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(lerp(x1, x2, k), lerp(y1, y2, k)); g.stroke(); }
function anchor(x, y, s, fill, stroke) { g.fillStyle = fill; g.strokeStyle = stroke; g.lineWidth = 2.5; g.fillRect(x - s / 2, y - s / 2, s, s); g.strokeRect(x - s / 2, y - s / 2, s, s); }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function cubicPt(p0, p1, p2, p3, u) {
  const m = 1 - u;
  return [m*m*m*p0[0] + 3*m*m*u*p1[0] + 3*m*u*u*p2[0] + u*u*u*p3[0], m*m*m*p0[1] + 3*m*m*u*p1[1] + 3*m*u*u*p2[1] + u*u*u*p3[1]];
}
function partialCubic(p0, p1, p2, p3, k) {
  g.beginPath(); g.moveTo(p0[0], p0[1]);
  const n = 80;
  for (let i = 1; i <= n * k; i++) { const q = cubicPt(p0, p1, p2, p3, i / n); g.lineTo(q[0], q[1]); }
  g.stroke();
}

// ---------- DESIGN: construction lines, a pen curve, shapes snapping into a composition ----------
function design(t) {
  const p = PAL.design; grid(p);
  const cx = W / 2, cy = H / 2;
  g.save(); g.translate(cx, cy); g.scale(1.22, 1.22); g.translate(-cx, -cy);
  const out = 1 - eio(seg(t, 6.6, 7.7));          // everything retracts at the end

  // Construction guides
  g.setLineDash([10, 12]); g.strokeStyle = p.soft; g.lineWidth = 2;
  const gk = eio(seg(t, 0.1, 1.0)) * out;
  line(cx, cy, cx - 560, cy, gk); line(cx, cy, cx + 560, cy, gk);
  line(cx, cy, cx, cy - 420, gk); line(cx, cy, cx, cy + 420, gk);
  g.beginPath(); g.arc(cx, cy, 300, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eio(seg(t, 0.4, 1.4)) * out); g.stroke();
  line(cx - 300, cy - 300, cx + 300, cy + 300, eio(seg(t, 0.6, 1.4)) * out);
  g.setLineDash([]);

  // Pen curve with handles (1.2 → 3.0)
  const P0 = [cx - 420, cy + 230], P1 = [cx - 420, cy - 330], P2 = [cx + 420, cy + 330], P3 = [cx + 420, cy - 230];
  const ck = eio(seg(t, 1.2, 3.0));
  const fade = 1 - eio(seg(t, 3.4, 4.2));
  if (ck > 0 && fade > 0) {
    g.globalAlpha = fade;
    g.strokeStyle = p.ink; g.lineWidth = 4;
    partialCubic(P0, P1, P2, P3, ck);
    g.lineWidth = 2; g.strokeStyle = p.ink;
    // handles of the current point
    const u = ck, q = cubicPt(P0, P1, P2, P3, u);
    const d = cubicPt(P0, P1, P2, P3, Math.min(1, u + 0.02)), e = cubicPt(P0, P1, P2, P3, Math.max(0, u - 0.02));
    const ang = Math.atan2(d[1] - e[1], d[0] - e[0]), L = 130;
    line(q[0] - Math.cos(ang) * L, q[1] - Math.sin(ang) * L, q[0] + Math.cos(ang) * L, q[1] + Math.sin(ang) * L);
    for (const s of [-1, 1]) { g.fillStyle = p.paper; g.beginPath(); g.arc(q[0] + s * Math.cos(ang) * L, q[1] + s * Math.sin(ang) * L, 9, 0, 7); g.fill(); g.stroke(); }
    anchor(P0[0], P0[1], 20, p.paper, p.ink);
    anchor(q[0], q[1], 22, p.ink, p.ink);
    if (ck >= 1) anchor(P3[0], P3[1], 20, p.paper, p.ink);
    g.globalAlpha = 1;
  }

  // Shapes fly in and snap into a composition (3.2 → 4.6)
  const sk = (a) => back(seg(t, a, a + 0.9)) * out;
  const s1 = sk(3.2), s2 = sk(3.45), s3 = sk(3.7);
  const S = 200;
  // square (paper)
  if (s1 > 0) {
    g.save(); g.translate(lerp(cx - 700, cx - 210, s1), cy - 110); g.rotate((1 - s1) * -0.8);
    g.fillStyle = p.paper; g.fillRect(-S / 2, -S / 2, S, S); g.restore();
  }
  // circle (ink)
  if (s2 > 0) {
    g.fillStyle = p.ink; g.beginPath(); g.arc(cx + 10, lerp(cy - 640, cy - 110, s2), S / 2, 0, 7); g.fill();
  }
  // quarter circle (paper outline → fill)
  if (s3 > 0) {
    g.save(); g.translate(lerp(cx + 760, cx + 120, s3), cy + 210); g.rotate((1 - s3) * 1.2);
    g.beginPath(); g.moveTo(-100, 100); g.lineTo(-100, -100); g.arc(-100, 100, 200, -Math.PI / 2, 0); g.closePath();
    const fk = eo(seg(t, 4.4, 5.0));
    g.fillStyle = `rgba(250,250,250,${fk})`; g.fill();
    g.strokeStyle = p.paper; g.lineWidth = 4; g.stroke();
    g.restore();
  }
  // an ink block completes the composition (bottom-left)
  const bk = back(seg(t, 3.95, 4.7)) * out;
  if (bk > 0) { g.fillStyle = p.ink; g.fillRect(cx - 310, cy + 110 + (1 - bk) * 200, 200, 200 * Math.min(1, bk)); }

  // Selection box with handles around everything (4.8 → 6.6)
  const sel = life(t, 4.8, 5.3, 6.4, 6.8);
  if (sel > 0) {
    const pad = 40 + (1 - sel) * 30, x0 = cx - 310 - pad, y0 = cy - 210 - pad, x1 = cx + 320 + pad, y1 = cy + 310 + pad;
    g.globalAlpha = sel; g.strokeStyle = p.ink; g.lineWidth = 2.5; g.strokeRect(x0, y0, x1 - x0, y1 - y0);
    for (const [hx, hy] of [[x0, y0], [x1, y0], [x0, y1], [x1, y1], [(x0 + x1) / 2, y0], [(x0 + x1) / 2, y1], [x0, (y0 + y1) / 2], [x1, (y0 + y1) / 2]]) anchor(hx, hy, 18, p.paper, p.ink);
    g.globalAlpha = 1;
  }
  g.restore();
}

// ---------- DEVELOP: lines of "code" that rebuild themselves into an interface ----------
const DEV_ROWS = [
  // [indent, width, colour] — abstract code lines, no characters
  [0, 300, 'ink'], [1, 420, 'soft'], [2, 260, 'accent'], [2, 380, 'soft'], [1, 180, 'ink'],
  [0, 340, 'ink'], [1, 500, 'soft'], [1, 220, 'soft'], [0, 120, 'ink'],
];
// where each bar ends up in the layout (x, y, w, h) inside the browser frame
function devLayout(fx, fy) {
  return [
    [fx + 40, fy + 90, 220, 36],            // logo / nav
    [fx + 40, fy + 170, 560, 70],           // headline
    [fx + 40, fy + 380, 160, 56],           // button (accent)
    [fx + 40, fy + 260, 460, 34],           // sub line
    [fx + 640, fy + 90, 220, 36],           // nav right
    [fx + 40, fy + 480, 260, 230],          // card 1
    [fx + 330, fy + 480, 260, 230],         // card 2
    [fx + 620, fy + 480, 260, 230],         // card 3
    [fx + 640, fy + 170, 240, 270],         // image block
  ];
}
function develop(t) {
  const p = PAL.develop; grid(p);
  const fx = 260, fy = 150, fw = 920, fh = 780;
  const colour = (k) => (k === 'accent' ? p.accent : k === 'soft' ? p.soft : p.ink);
  const morph = eio(seg(t, 2.6, 3.8)) * (1 - eio(seg(t, 6.4, 7.4)));   // bars ⇄ layout
  const frame = life(t, 2.5, 3.3, 6.6, 7.3);

  // Browser frame draws in around the layout
  if (frame > 0) {
    g.strokeStyle = p.ink; g.lineWidth = 3;
    const k = frame;
    g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + fw * k, fy); g.stroke();
    g.beginPath(); g.moveTo(fx + fw, fy + fh); g.lineTo(fx + fw - fw * k, fy + fh); g.stroke();
    g.beginPath(); g.moveTo(fx, fy + fh); g.lineTo(fx, fy + fh - fh * k); g.stroke();
    g.beginPath(); g.moveTo(fx + fw, fy); g.lineTo(fx + fw, fy + fh * k); g.stroke();
    g.globalAlpha = k; g.fillStyle = p.paper; g.fillRect(fx + 1.5, fy + 1.5, fw - 3, 50);
    g.fillStyle = p.ink; g.fillRect(fx, fy + 50, fw, 3);
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(fx + 30 + i * 26, fy + 25, 7, 0, 7); g.fillStyle = i === 0 ? p.accent : p.soft; g.fill(); }
    g.globalAlpha = 1;
  }

  const lay = devLayout(fx, fy);
  const bx = 300, by = 250, lh = 70;
  DEV_ROWS.forEach(([ind, w, col], i) => {
    // typing: each row grows in turn (0.2 → 2.4), and un-types at the very end
    const typed = eo(seg(t, 0.2 + i * 0.22, 0.2 + i * 0.22 + 0.35)) * (1 - eo(seg(t, 7.3, 7.9)));
    if (typed <= 0) return;
    const codeR = [bx + ind * 60, by + i * lh, w * typed, 26];
    const L = lay[i];
    const lift = i >= 5 && i <= 7 ? Math.sin(seg(t, 4.2 + (i - 5) * 0.15, 5.4 + (i - 5) * 0.15) * Math.PI) * 18 : 0;
    const x = lerp(codeR[0], L[0], morph), y = lerp(codeR[1], L[1], morph) - lift * morph;
    const ww = lerp(codeR[2], L[2], morph), hh = lerp(codeR[3], L[3], morph);
    let fill = colour(col);
    if (morph > 0.5 && i >= 5 && i <= 8) fill = i === 8 ? p.ink : p.paper;   // cards + image block
    g.fillStyle = fill;
    rrect(x, y, ww, hh, lerp(13, i >= 5 ? 10 : 6, morph)); g.fill();
    if (morph > 0.5 && i >= 5 && i <= 7) {                                    // card contents
      g.globalAlpha = seg(morph, 0.5, 1);
      g.fillStyle = p.soft; g.fillRect(x + 24, y + hh - 70, ww * 0.55, 14); g.fillRect(x + 24, y + hh - 44, ww * 0.35, 14);
      g.globalAlpha = 1;
    }
  });
  // blinking cursor while typing
  const typingEnd = 0.2 + DEV_ROWS.length * 0.22 + 0.35;
  if (t < 2.6 && t > 0.1) {
    const last = Math.min(DEV_ROWS.length - 1, Math.floor((t - 0.2) / 0.22));
    const [ind, w] = DEV_ROWS[Math.max(0, last)];
    const typed = eo(seg(t, 0.2 + last * 0.22, 0.2 + last * 0.22 + 0.35));
    if (t > typingEnd ? Math.floor(t * 3) % 2 === 0 : true) { g.fillStyle = p.accent; g.fillRect(bx + ind * 60 + w * typed + 16, by + last * lh - 6, 16, 38); }
  }
  // toggle in the layout flips once it's assembled
  const tg = life(t, 3.8, 4.2, 6.3, 6.6);
  if (tg > 0) {
    const tx = fx + 230, ty = fy + 384; g.globalAlpha = tg;
    rrect(tx, ty, 96, 48, 24); g.fillStyle = seg(t, 4.6, 4.9) > 0.5 ? p.accent : p.soft; g.fill();
    g.fillStyle = p.paper; g.beginPath(); g.arc(tx + 24 + 48 * eio(seg(t, 4.6, 4.9)), ty + 24, 17, 0, 7); g.fill();
    g.globalAlpha = 1;
  }
}

// ---------- DEPLOY: a module charges, launches, and the network lights up ----------
const NODES = (() => {
  const pts = []; let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) {
    const a = rnd() * Math.PI * 2, r = 180 + rnd() * 380;
    pts.push([W / 2 + Math.cos(a) * r * 1.25, H / 2 - 60 + Math.sin(a) * r * 0.8]);
  }
  return pts;
})();
function deploy(t) {
  const p = PAL.deploy; grid(p);
  const cx = W / 2, base = H - 230;
  // module: charging on the pad (0.2 → 1.8), launch (1.8 → 3.0), back home at the end (7.0 → 7.9)
  const charge = eio(seg(t, 0.3, 1.7));
  const launch = Math.pow(seg(t, 1.8, 3.0), 2.2);
  const home = eo(seg(t, 7.0, 7.9));
  const S = 170;
  let my = base - S / 2 - 14;
  if (t >= 1.8 && t < 7.0) my = lerp(my, -200, launch);
  if (t >= 7.0) my = lerp(H + 200, base - S / 2 - 14, home);
  const pad = 1 - eio(seg(t, 3.0, 3.6)) + eo(seg(t, 6.8, 7.3));
  // launch pad
  if (pad > 0) { g.globalAlpha = Math.min(1, pad); g.fillStyle = p.soft; g.fillRect(cx - 160, base, 320, 4); g.globalAlpha = 1; }
  // trail
  if (t > 1.8 && t < 3.6) {
    for (let i = 0; i < 14; i++) {
      const tt = t - i * 0.035; if (tt < 1.8) break;
      const yy = lerp(base - S / 2 - 14, -200, Math.pow(seg(tt, 1.8, 3.0), 2.2));
      g.globalAlpha = (1 - i / 14) * 0.6 * (1 - seg(t, 3.0, 3.6)); g.fillStyle = p.accent;
      g.fillRect(cx - 5, yy + S / 2 + 10 + i * 6, 10, 10);
    }
    g.globalAlpha = 1;
  }
  // charging ring
  if (charge > 0 && t < 2.2) {
    g.strokeStyle = p.accent; g.lineWidth = 6; g.globalAlpha = 1 - seg(t, 1.8, 2.2);
    g.beginPath(); g.arc(cx, base - S / 2 - 14, S * 0.95, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * charge); g.stroke();
    g.globalAlpha = 1;
  }
  // module
  g.fillStyle = p.paper; g.save(); g.translate(cx, my); g.rotate(t >= 1.8 && t < 3 ? launch * 0.4 : 0);
  g.fillRect(-S / 2, -S / 2, S, S); g.fillStyle = p.accent; g.fillRect(-S / 2 + 40, -S / 2 + 40, 38, 38); g.fillRect(S / 2 - 78, S / 2 - 78, 38, 38);
  g.restore();

  // the network goes live: rings ripple out, links draw, nodes light up (3.0 → 6.6)
  const net = life(t, 3.0, 3.6, 6.4, 7.0);
  const hub = [cx, H / 2 - 60];
  if (net > 0) {
    // ripples
    for (let i = 0; i < 3; i++) {
      const r = seg(t, 3.0 + i * 0.6, 5.2 + i * 0.6);
      if (r <= 0 || r >= 1) continue;
      g.strokeStyle = `rgba(250,92,1,${(1 - r) * 0.7 * net})`; g.lineWidth = 3;
      g.beginPath(); g.ellipse(hub[0], hub[1], r * 760, r * 500, 0, 0, 7); g.stroke();
    }
    // links from hub to nodes as the ripple reaches them
    NODES.forEach((n, i) => {
      const d = Math.hypot((n[0] - hub[0]) / 760, (n[1] - hub[1]) / 500);
      const reach = seg(t, 3.0 + d * 2.2, 3.3 + d * 2.2);
      if (reach <= 0) return;
      g.strokeStyle = `rgba(250,250,250,${0.18 * net})`; g.lineWidth = 2;
      line(hub[0], hub[1], n[0], n[1], eo(reach));
      const near = NODES[(i + 5) % NODES.length];
      line(n[0], n[1], near[0], near[1], eo(seg(t, 3.6 + d * 2.2, 4.2 + d * 2.2)) * 0.999);
      const lit = reach >= 1;
      const pulse = 1 + 0.25 * Math.sin((t - d) * 5);
      g.globalAlpha = net;
      g.fillStyle = lit ? p.accent : p.paper;
      const s = (lit ? 16 : 10) * (lit ? pulse : 1);
      g.fillRect(n[0] - s / 2, n[1] - s / 2, s, s);
      g.globalAlpha = 1;
    });
    // hub
    g.globalAlpha = net; g.fillStyle = p.paper; g.fillRect(hub[0] - 22, hub[1] - 22, 44, 44); g.globalAlpha = 1;
  }
}

const SCENES = { design, develop, deploy };
const params = new URLSearchParams(location.search);
const scene = SCENES[params.get('scene') || 'design'];
const status = document.getElementById('status');

if (params.get('record')) {
  // Record exactly one loop, then upload it
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mime = types.find((m) => MediaRecorder.isTypeSupported(m));
  const stream = c.captureStream(60);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    const blob = new Blob(chunks, { type: mime });
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const r = await fetch(`/save?name=${params.get('scene')}.${ext}`, { method: 'POST', body: blob });
    status.textContent = `saved ${params.get('scene')}.${ext} ${blob.size} bytes ${mime} ${r.status}`;
    window.__done = status.textContent;
  };
  scene(0);
  rec.start();
  const t0 = performance.now();
  const tick = () => {
    const t = (performance.now() - t0) / 1000;
    scene(Math.min(t, T));
    if (t < T) requestAnimationFrame(tick); else { scene(0); setTimeout(() => rec.stop(), 60); }
  };
  requestAnimationFrame(tick);
  status.textContent = 'recording ' + mime;
} else {
  const t0 = performance.now();
  const tick = () => { scene(((performance.now() - t0) / 1000) % T); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
