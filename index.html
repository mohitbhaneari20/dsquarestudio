<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E6E1D8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- seo:start — replaced per page at build time from src/seo/meta.ts (see vite.config.ts) -->
    <title>Dsquare Studio — Design & Development Studio</title>
    <meta name="description" content="Dsquare Studio is an independent design and development studio creating brands, digital products, websites and experiences that solve real problems." />
    <link rel="canonical" href="https://www.dsquare.studio/" />
    <!-- seo:end -->

    <!--
      Google Search Console: paste your verification tag here, e.g.
      <meta name="google-site-verification" content="YOUR-CODE" />
      (or verify the domain with a DNS TXT record instead — then nothing is needed here)
    -->

    <!-- The loader plays on every load, so paint its orange right away (no flash) -->
    <script>
      // (No loader for visitors who prefer reduced motion, so no orange either)
      // The intro only opens a visit that starts on the homepage, once per session (see LoadingScreen)
      try {
        var choice = localStorage.getItem('dsq-motion');
        var motionOff = choice ? choice === 'off' : matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (location.pathname === '/' && !sessionStorage.getItem('dsq-intro-seen') && !motionOff)
          document.documentElement.classList.add('intro-pending');
      } catch (e) {}
    </script>
    <style>
      /* Only the root (it paints the canvas + scrollbar gutter); the page itself keeps its own colour */
      html.intro-pending { background: #ff6600 !important; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (the loader covers the swap) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" />
    </noscript>
  </head>
  <body style="background:#e6e1d8">
    <div id="root"></div>
    <!-- seo:noscript --><noscript>Dsquare Studio — an independent design and development studio. This site needs JavaScript.</noscript><!-- /seo:noscript -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
